<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>泡芙的房间</title>
<meta name="description" content="一只叫泡芙的猫，从巴掌大的奶猫长到成年。打开回忆，看房间一点点被占领。" />
<link rel="stylesheet" href="style.css?v=20261028-4" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <!-- 3D 场景挂载点 -->
  <div id="stage"></div>

  <!-- 首屏 loading -->
  <div id="loading">
    <div class="loading-inner">
      <div class="cat-paw"><span></span><span></span><span></span></div>
      <p class="loading-title">正在给泡芙布置房间…</p>
      <p class="loading-sub">泡芙出生于 2022-03-15</p>
    </div>
  </div>

  <!-- 顶部：标题 + 回忆入口 -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">泡芙的房间</span>
      <span class="brand-sub">从巴掌大的奶猫到成年</span>
    </div>
    <button id="week-sign" type="button" aria-label="打开泡芙的回忆时间线">泡芙online第 1 天</button>
  </header>

  <!-- 左下角提示 -->
  <div id="hint">
    <span>拖动旋转视角</span><span class="sep">·</span><span>点家具看它的记忆</span><span class="sep">·</span><span>点右上角看泡芙的回忆</span>
  </div>

  <div id="story-panel" class="hidden" role="dialog" aria-label="泡芙的回忆时间线" aria-hidden="true">
    <button id="story-close" class="icon-btn close" type="button" aria-label="关闭回忆">×</button>
    <div class="story-eyebrow">泡芙的回忆</div>
    <div id="story-date"></div>
    <label class="timeline-control" for="timeline-slider">时间轴
      <input id="timeline-slider" type="range" min="0" max="1" step="1" value="0" aria-label="按月拖动时间轴" />
    </label>
    <p id="story-text"></p>
    <button id="story-play" class="pill-btn accent" type="button">暂停播放</button>
  </div>

  <div id="holo-layer" class="hidden" aria-hidden="true">
    <div id="holo-origin"></div>
    <div id="holo-beam"></div>
    <button id="holo-card" type="button" aria-label="放大当前回忆">
      <img id="holo-photo" alt="泡芙的回忆" />
      <video id="holo-video" muted loop playsinline></video>
      <span id="holo-date"></span>
      <span id="holo-text"></span>
      <small>点击放大回忆</small>
    </button>
  </div>

  <div id="video-layer" class="overlay hidden" aria-hidden="true">
    <div id="video-card" role="dialog" aria-modal="true" aria-label="泡芙的电脑视频">
      <button id="video-close" class="icon-btn close" type="button" aria-label="关闭视频">×</button>
      <h2>泡芙的电脑</h2>
      <video id="computer-video" controls playsinline></video>
      <img id="computer-photo" alt="泡芙的回忆照片" />
      <p id="video-empty">视频稍后添加</p>
    </div>
  </div>

  <!-- 右下角按钮组 -->
  <div id="action-bar">
    <button id="btn-overview" class="pill-btn" type="button" title="回到初始机位">回到全景</button>
    <button id="btn-record" class="pill-btn accent" type="button" title="把今天的照片记进房间">记录今天</button>
  </div>

  <!-- 记忆卡片（普通 DOM 叠在 canvas 上） -->
  <div id="card-layer" class="overlay hidden" aria-hidden="true">
    <div id="card" role="dialog" aria-modal="true" aria-labelledby="card-name">
      <button id="card-close" class="icon-btn close" type="button" aria-label="关闭">×</button>
      <div id="card-name"></div>
      <p id="card-memory"></p>
      <div id="card-media"></div>
      <p id="card-hint"></p>
      <div id="card-info">
        <span id="card-date"></span>
        <span id="card-text"></span>
      </div>
      <div id="card-foot">
        <button id="card-prev" class="icon-btn" type="button" aria-label="上一张">‹</button>
        <span id="card-count">1 / 1</span>
        <button id="card-next" class="icon-btn" type="button" aria-label="下一张">›</button>
      </div>
    </div>
  </div>

  <!-- 页面内记录（拍立得上传） -->
  <div id="record-layer" class="overlay hidden" aria-hidden="true">
    <div id="record-modal" role="dialog" aria-modal="true" aria-labelledby="record-title">
      <div class="modal-head">
        <h2 id="record-title">记录今天</h2>
        <button id="rec-close" class="icon-btn close" type="button" aria-label="关闭">×</button>
      </div>
      <form id="rec-form" novalidate>
        <label class="field">
          <span class="field-label">这是哪件家具的事</span>
          <select id="rec-object"></select>
        </label>
        <label class="field">
          <span class="field-label">日期</span>
          <input id="rec-date" type="date" />
        </label>
        <label class="field">
          <span class="field-label">一句话</span>
          <input id="rec-desc" type="text" maxlength="60" placeholder="例如：第一次睡沙发" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">照片或视频</span>
          <input id="rec-file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4" />
        </label>
        <div id="rec-preview"></div>
        <p id="rec-error" class="error" role="alert"></p>
        <div class="modal-actions">
          <button id="rec-cancel" class="pill-btn" type="button">取消</button>
          <button id="rec-submit" class="pill-btn accent" type="submit">保存到房间</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 提示条 -->
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="main.js?v=20261028-9"></script>
</body>
</html>
